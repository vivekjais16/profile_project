version: '3.8'

services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivek_portfolio_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
