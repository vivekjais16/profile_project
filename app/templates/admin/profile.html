{% extends "admin/base.html" %}

{% block title %}Edit Profile & Bio{% endblock %}

{% block content %}
<div class="space-y-6">

    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Edit Profile & Executive Bio</h1>
            <p class="text-xs text-slate-400 mt-0.5">All updates save instantly into SQLite database and update live on the web</p>
        </div>
    </div>

    {% if msg %}
    <div class="p-4 rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
        <span>{{ msg }}</span>
    </div>
    {% endif %}

    <form action="/admin/profile" method="post" class="glass-panel rounded-2xl p-6 border border-slate-800 space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="full_name" class="block text-xs font-mono text-slate-300 mb-1">Full Name</label>
                <input type="text" id="full_name" name="full_name" required value="{{ profile.full_name }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label for="years_of_experience" class="block text-xs font-mono text-slate-300 mb-1">Years of Experience</label>
                <input type="number" step="0.1" id="years_of_experience" name="years_of_experience" required value="{{ profile.years_of_experience }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <div>
            <label for="headline" class="block text-xs font-mono text-slate-300 mb-1">Headline Badge</label>
            <input type="text" id="headline" name="headline" required value="{{ profile.headline }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label for="sub_headline" class="block text-xs font-mono text-slate-300 mb-1">Hero Subheadline</label>
            <input type="text" id="sub_headline" name="sub_headline" value="{{ profile.sub_headline }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label for="email" class="block text-xs font-mono text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required value="{{ profile.email }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label for="phone" class="block text-xs font-mono text-slate-300 mb-1">Phone Number</label>
                <input type="text" id="phone" name="phone" required value="{{ profile.phone }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label for="location" class="block text-xs font-mono text-slate-300 mb-1">Location</label>
                <input type="text" id="location" name="location" required value="{{ profile.location }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="linkedin_url" class="block text-xs font-mono text-slate-300 mb-1">LinkedIn Profile URL</label>
                <input type="url" id="linkedin_url" name="linkedin_url" required value="{{ profile.linkedin_url }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label for="github_url" class="block text-xs font-mono text-slate-300 mb-1">GitHub Profile URL</label>
                <input type="url" id="github_url" name="github_url" value="{{ profile.github_url or '' }}" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <div>
            <label for="job_objective" class="block text-xs font-mono text-slate-300 mb-1">Job Objective / Target Role Vision</label>
            <textarea id="job_objective" name="job_objective" rows="3" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">{{ profile.job_objective }}</textarea>
        </div>

        <div>
            <label for="profile_summary_1" class="block text-xs font-mono text-slate-300 mb-1">Profile Summary 1 (Backend & Microservices)</label>
            <textarea id="profile_summary_1" name="profile_summary_1" rows="4" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">{{ profile.profile_summary_1 }}</textarea>
        </div>

        <div>
            <label for="profile_summary_2" class="block text-xs font-mono text-slate-300 mb-1">Profile Summary 2 (Generative AI & Data Engineering)</label>
            <textarea id="profile_summary_2" name="profile_summary_2" rows="4" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">{{ profile.profile_summary_2 }}</textarea>
        </div>

        <button type="submit" class="px-8 py-3 rounded-xl font-semibold text-sm bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-dark-950 transition flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save Profile Changes
        </button>
    </form>

</div>
{% endblock %}
