<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %} — Vivek Jaiswal Portfolio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#0b0f19',
                            800: '#131c2e',
                            700: '#1e293b',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <header class="glass-nav border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/admin" class="flex items-center space-x-2 font-bold text-lg text-white">
                    <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-sm font-mono">VJ</span>
                    <span>Admin Control Center</span>
                </a>
                <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-500/30">
                    Production Database Active
                </span>
            </div>

            <div class="flex items-center space-x-4 text-sm">
                <a href="/" target="_blank" class="text-slate-400 hover:text-emerald-400 transition flex items-center gap-1 text-xs">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> View Live Portfolio
                </a>
                <div class="h-4 w-px bg-slate-800"></div>
                <span class="text-xs text-slate-400 font-mono flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span> {{ admin_user }}
                </span>
                <a href="/admin/logout" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-500/30 transition flex items-center gap-1">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
                </a>
            </div>
        </div>
    </header>

    <!-- Main Admin Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow grid grid-cols-1 lg:grid-cols-5 gap-8">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-1 space-y-1.5">
            <div class="text-xs font-mono uppercase text-slate-500 px-3 mb-2 font-semibold">Management</div>
            
            <a href="/admin" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-indigo-400"></i> Dashboard
            </a>
            
            <a href="/admin/profile" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="user" class="w-4 h-4 text-emerald-400"></i> Profile & Bio
            </a>

            <a href="/admin/experiences" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="briefcase" class="w-4 h-4 text-cyan-400"></i> Experiences
            </a>

            <a href="/admin/skills" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="code-2" class="w-4 h-4 text-amber-400"></i> Skills Matrix
            </a>

            <a href="/admin/projects" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="layers" class="w-4 h-4 text-rose-400"></i> Case Studies
            </a>

            <a href="/admin/qualifications" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="award" class="w-4 h-4 text-yellow-400"></i> Qualifications
            </a>

            <a href="/admin/messages" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="mail" class="w-4 h-4 text-teal-400"></i> Inquiries Inbox
            </a>

            <div class="text-xs font-mono uppercase text-slate-500 px-3 pt-6 mb-2 font-semibold">System</div>

            <a href="/admin/logs" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="activity" class="w-4 h-4 text-emerald-400"></i> System Logs & Activity
            </a>

            <a href="/admin/settings" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                <i data-lucide="shield-check" class="w-4 h-4 text-purple-400"></i> Admin Credentials
            </a>

            <form action="/admin/reseed" method="post" onsubmit="return confirm('Restore database with resume defaults? Any custom manual records will be restored to resume state.');" class="pt-2">
                <button type="submit" class="w-full text-left flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-mono text-slate-400 hover:text-rose-400 hover:bg-rose-950/30 transition">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Restore Resume DB
                </button>
            </form>
        </aside>

        <!-- Main Content Area -->
        <main class="lg:col-span-4 space-y-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
