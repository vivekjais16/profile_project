services:
  - type: web
    name: vivek-jaiswal-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
