version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Apache Kafka & Zookeeper Cluster
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: streaming_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - streaming_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streaming_kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: "snappy"
    networks:
      - streaming_net

  # ---------------------------------------------------------------------------
  # PySpark Streaming Cluster (Master + Worker)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: streaming_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - streaming_net

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: streaming_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    networks:
      - streaming_net

  # ---------------------------------------------------------------------------
  # Persistence Layer (PostgreSQL & Redis)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: streaming_postgres
    environment:
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - streaming_net

  redis:
    image: redis:7.2-alpine
    container_name: streaming_redis
    ports:
      - "6379:6379"
    networks:
      - streaming_net

  # ---------------------------------------------------------------------------
  # Real-Time Telemetry & FastAPI Analytics Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaming_api_gateway
    depends_on:
      - kafka
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    networks:
      - streaming_net

networks:
  streaming_net:
    driver: bridge

volumes:
  postgres_data:
